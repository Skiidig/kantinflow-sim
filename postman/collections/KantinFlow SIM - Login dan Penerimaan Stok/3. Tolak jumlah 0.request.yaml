$kind: http-request
description: Validasi berjalan sebelum transaksi, sehingga tidak ada batch atau riwayat baru dan saldo tetap 5.
url: "{{baseUrl}}/api/v1/stock/receipts"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
  Idempotency-Key: demo-receipt-zero
body:
  type: json
  content: |-
    {
      "itemId": "{{itemId}}",
      "batchCode": "SUSU-DEMO-02",
      "quantity": "0",
      "unitCost": "4500.00",
      "receivedOn": "2026-11-17",
      "expiresOn": "2026-11-24"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Ditolak 400', () => pm.response.to.have.status(400));
      pm.test('Kode validasi dan alasan jumlah', () => {
        pm.expect(body.error.code).to.eql('VALIDATION_ERROR');
        pm.expect(body.error.fields.quantity).to.eql('Jumlah harus lebih dari 0');
      });
    language: text/javascript
order: 3000
